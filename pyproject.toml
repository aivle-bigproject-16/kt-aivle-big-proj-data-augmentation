[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-fail-augment"
version = "1.7"
description = "Deterministic CT/RGB PASS-FAIL dataset planner and generator"
requires-python = ">=3.10"
dependencies = [
  "Pillow==12.3.0",
  "numpy==2.5.1",
  "shapely==2.1.2",
  "psutil==7.0.0",
]

[project.scripts]
quality-fail-augment = "quality_fail_augment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
